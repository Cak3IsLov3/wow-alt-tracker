<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}WoW Alt Tracker{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">WoW Alt Tracker</a>
    {% if user %}
    <nav>
      <a href="/">Planner</a>
      <a href="/characters">Characters</a>
      <a href="/tasks">Taken</a>
      <a href="/compare">Vergelijken</a>
    </nav>
    <div class="account">
      <span class="muted">{{ user.battletag }} · {{ user.region|upper }}</span>
      <form method="post" action="/sync"><button class="primary">Sync nu</button></form>
      <form method="post" action="/auth/logout"><button>Uitloggen</button></form>
    </div>
    {% endif %}
  </header>
  <main>
    {% for message in messages %}
    <div class="flash {{ message.kind }}">{{ message.text }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
