{% extends "base.html" %}
{% block content %}
<section class="panel">
  <h1>Compare characters</h1>
  <form method="get" action="/compare" class="row">
    {% for field, selected in [('a', a), ('b', b)] %}
    <label>Character {{ loop.index }}
      <select name="{{ field }}">
        <option value="">Choose…</option>
        {% for c in characters %}
        <option value="{{ c.id }}" {{ 'selected' if selected == c.id|string }}>{{ c.name }} ({{ c.class_name }})</option>
        {% endfor %}
      </select>
    </label>
    {% endfor %}
    <button class="primary">Compare</button>
  </form>
  {% if a and b %}
  <canvas id="history" data-ids="{{ a }},{{ b }}" height="110"></canvas>
  {% else %}
  <p class="muted">Choose two characters to compare their item level and M+ score over time.</p>
  {% endif %}
</section>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="/static/charts.js"></script>
{% endblock %}
