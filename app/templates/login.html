{% extends "base.html" %}
{% block content %}
<section class="panel narrow">
  <h1>All your alts in one overview</h1>
  <p class="muted">Log in with Battle.net to track your characters, weekly tasks and gear.</p>
  {% if not configured %}
  <div class="flash error">
    BLIZZARD_CLIENT_ID and BLIZZARD_CLIENT_SECRET are not set yet. See <code>.env.example</code>.
  </div>
  {% endif %}
  <form method="get" action="/auth/login" class="row">
    <label>Region
      <select name="region">
        {% for region in regions %}
        <option value="{{ region }}" {{ 'selected' if region == default_region }}>{{ region|upper }}</option>
        {% endfor %}
      </select>
    </label>
    <button class="primary">Log in with Battle.net</button>
  </form>
</section>
{% endblock %}
