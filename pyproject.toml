[project]
name = "wow-alt-tracker"
version = "0.1.0"
description = "Weekly checklist, gear analysis and progress tracking for your WoW alts"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "sqlmodel>=0.0.48",
    "pydantic-settings>=2.4",
    "cryptography>=43",
    "apscheduler>=3.10,<4",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
